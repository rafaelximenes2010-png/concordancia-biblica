<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2350">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farol LOS">
<title>Farol Operacional · CT LOS</title>
<style>
:root{--navy:#0f2350;--navy2:#1b3a7a;--red:#d32f2f;--bg:#f3f5f9;--card:#fff;--ink:#14213d;--ink2:#5b6478;--line:#e3e7ef;
--g:#1e8e4e;--y:#d08a0e;--r:#c62828;--gs:#e5f4ea;--ys:#fdf2dc;--rs:#fbe5e5;--rad:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0c1426;--card:#152039;--ink:#eef2fa;--ink2:#a5b0c6;--line:#24324f;--gs:#123524;--ys:#3a2c0c;--rs:#3d1717}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:84px}
header{background:linear-gradient(135deg,#0b1a3f,#1b3a7a 70%,#2346a0);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.logo b{color:var(--red);font-weight:900;font-size:13px;letter-spacing:-.5px}
.ht{flex:1;min-width:0}.ht b{display:block;font-size:17px;letter-spacing:.2px}.ht small{opacity:.8;font-size:12px}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;position:relative;cursor:pointer}
.hbtn i{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:#ff5252;border:2px solid #1b3a7a}
.upd{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;opacity:.9}
.upd .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.datebar{display:flex;align-items:center;gap:8px;margin-left:auto}
.datebar select{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:6px 8px;font:inherit;font-size:12px}
.datebar option{color:#000}
main{padding:14px 14px 0;max-width:980px;margin:0 auto}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:20px 4px 10px;display:flex;align-items:center;gap:8px}
h2 small{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;box-shadow:0 1px 2px rgba(15,35,80,.04)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--ink2)}
.kpi.hero{background:linear-gradient(135deg,#0f2350,#1b3a7a);color:#fff;border:0}.kpi.hero .l,.kpi.hero .s{color:rgba(255,255,255,.8)}
.est{display:inline-block;font-size:10px;font-weight:700;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.up{color:var(--g)}.dn{color:var(--r)}.hero .up{color:#7ef0a8}
.farol{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.fr{border-radius:14px;padding:10px 8px;text-align:center;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:inherit}
.fr .b{width:22px;height:22px;border-radius:50%;margin:0 auto 6px;box-shadow:inset -3px -3px 6px rgba(0,0,0,.25),inset 2px 2px 4px rgba(255,255,255,.5)}
.fr .n{font-size:11px;font-weight:700;color:var(--ink2);min-height:26px;display:flex;align-items:center;justify-content:center;line-height:1.15}
.fr .p{font-size:20px;font-weight:800}
.fr.g .b{background:var(--g)}.fr.y .b{background:var(--y)}.fr.r .b{background:var(--r)}
.fr.g .p{color:var(--g)}.fr.y .p{color:var(--y)}.fr.r .p{color:var(--r)}
.fcount{display:flex;gap:8px;margin-top:10px}.fcount div{flex:1;border-radius:12px;padding:8px;text-align:center;font-size:12px;font-weight:600}
.fcount b{display:block;font-size:20px}
.cg{background:var(--gs);color:var(--g)}.cy{background:var(--ys);color:var(--y)}.cr{background:var(--rs);color:var(--r)}
.act{border-left:4px solid var(--r)}
.act .t{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid3 div{background:var(--bg);border-radius:10px;padding:8px}.grid3 small{display:block;font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.grid3 b{font-size:14px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tr.tot td{font-weight:800}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px}
.pill.g{background:var(--gs);color:var(--g)}.pill.y{background:var(--ys);color:var(--y)}.pill.r{background:var(--rs);color:var(--r)}
.rank{display:grid;gap:8px}.rk{display:grid;grid-template-columns:110px 1fr 50px;align-items:center;gap:8px;font-size:12px;font-weight:700;cursor:pointer}
.rk .bar{height:14px;background:var(--bg);border-radius:8px;position:relative;overflow:hidden}
.rk .bar span{position:absolute;inset:0 auto 0 0;border-radius:8px}
.rk .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.note{font-size:12px;color:var(--ink2);margin:8px 4px 0;line-height:1.45}
.warn{background:var(--ys);color:#7a5200;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:10px}
@media (prefers-color-scheme:dark){.warn{color:#f5d38a}}
.motto{text-align:center;font-weight:800;font-style:italic;margin:22px 0 6px;color:var(--navy2)}.motto em{color:var(--red);font-style:italic}
@media (prefers-color-scheme:dark){.motto{color:#9fb6ff}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav.tabs button{flex:1;background:none;border:0;color:var(--ink2);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;border-radius:12px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--navy2);background:rgba(27,58,122,.08)}
@media (prefers-color-scheme:dark){nav.tabs button.on{color:#9fb6ff}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:9px;font:inherit;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(5,12,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.sh b{font-size:18px;flex:1}.sh button{border:0;background:var(--card);width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--ink);cursor:pointer}
.al{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.al .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:15px}
.al b{display:block;font-size:14px}.al small{color:var(--ink2);font-size:12px}
.share{position:fixed;right:14px;bottom:86px;width:48px;height:48px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:8;cursor:pointer}
.q{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.q.c{background:var(--rs);color:var(--r)}.q.p{background:var(--ys);color:var(--y)}.q.a{background:var(--gs);color:var(--g)}
.kpi[data-m],[data-m]{cursor:pointer}.kpi[data-m] .l::after{content:"ⓘ";margin-left:5px;opacity:.55;font-size:11px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}
.src.bi{background:#fff4d6;color:#8a5a00}.src.orc{background:#e6efff;color:#1b3a7a}.src.calc{background:#eef0f4;color:#4b5563}.src.est2{background:#ede9fe;color:#5b21b6}
@media (prefers-color-scheme:dark){.src.bi{background:#3a2c0c;color:#f5d38a}.src.orc{background:#16264a;color:#a9c1ff}.src.calc{background:#24324f;color:#c7cfdf}.src.est2{background:#2e2150;color:#c9b6ff}}
.big{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:4px 0 8px}
.fx{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--bg);border-radius:10px;padding:10px;line-height:1.6;white-space:pre-wrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.kv:last-child{border:0}.kv b{white-space:nowrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp>div{border-radius:12px;padding:10px}.cmp small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}.cmp b{font-size:17px}
.cmp .b1{background:#fff4d6;color:#8a5a00}.cmp .b2{background:#e6efff;color:#1b3a7a}
@media (prefers-color-scheme:dark){.cmp .b1{background:#3a2c0c;color:#f5d38a}.cmp .b2{background:#16264a;color:#a9c1ff}}
.sec{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:14px 2px 6px}
.cfg label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}.cfg input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}.btn.sec2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.inst{display:none;margin-left:6px;background:#fff;color:var(--navy);border:0;border-radius:10px;padding:6px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.dds{background:repeating-linear-gradient(135deg,#f2c200 0 14px,#1d1d1d 14px 28px);padding:0 0 0 14px;border:0;overflow:hidden}
.dds>div{background:#fff8dc;padding:14px;color:#3b2f00}
@media (prefers-color-scheme:dark){.dds>div{background:#2b2408;color:#f5e6b0}}
.dds .k{font-size:10px;font-weight:800;letter-spacing:.12em;color:#8a6a00;text-transform:uppercase}
.dds b.t{display:block;font-size:16px;margin:4px 0 6px}.dds p{margin:0;font-size:14px;line-height:1.5}
.res p{margin:0 0 10px;font-size:15px;line-height:1.6}.res p:last-child{margin:0}
.res a{color:var(--navy2);font-weight:700;text-decoration:none;border-bottom:1.5px dotted currentColor;cursor:pointer}
@media (prefers-color-scheme:dark){.res a{color:#9fb6ff}}
.res .dn2{color:var(--r)}.frase{font-style:italic;font-weight:700;font-size:15px;line-height:1.5}
.load{display:flex;align-items:center;gap:12px;border:2px dashed #9fb3dd;background:linear-gradient(135deg,rgba(27,58,122,.06),rgba(27,58,122,.02))}
.load .ic{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.load b{display:block}.load small{color:var(--ink2);font-size:12px}.load .btn{margin-left:auto;white-space:nowrap}
.edit{border-left:4px solid var(--navy2)}.edit .k{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--red);text-transform:uppercase}
.edit p{margin:6px 0 0;font-family:Georgia,serif;font-size:15.5px;line-height:1.55}
.empty{text-align:center;padding:40px 20px}.empty .ic{font-size:44px}.empty b{display:block;font-size:18px;margin:10px 0 6px}
.av{background:var(--ys);color:#7a5200;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:10px}
@media (prefers-color-scheme:dark){.av{color:#f5d38a}}
.proto{background:#fff3cd;color:#6b4e00;text-align:center;font-size:11px;padding:5px;font-weight:600}
</style>
</head>
<body>
<div class="proto" id="proto">ALIMENTADO PELO PDF · a API do Power BI entra quando a TI liberar</div>
<input type="file" id="pdfIn" accept="application/pdf" hidden>
<header>
  <div class="hrow">
    <div class="logo"><b>LOS</b></div>
    <div class="ht"><b>Farol Operacional</b><small>CT LOS · Grupo LOS consolidado</small></div>
    <button class="inst" id="bInst">Instalar</button><button class="hbtn" id="bAl" aria-label="Alertas">🔔<i></i></button><button class="hbtn" id="bCfg" aria-label="Configurações">⚙︎</button>
  </div>
  <div class="upd"><span class="dot"></span><span id="updT">Carregando…</span>
    <span class="datebar"><select id="dSel" aria-label="Escolher dia"></select></span></div>
</header>
<main id="main"></main>
<button class="share" id="bSh" aria-label="Compartilhar no WhatsApp">↗</button>
<nav class="tabs">
  <button data-t="hoje" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</button>
  <button data-t="mes"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16v-5M11 16V7M16 16v-8M21 16V4"/></svg>Mês</button>
  <button data-t="reg"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Regionais</button>
  <button data-t="proj"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Projeção</button>
  <button data-t="orc"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h3M8 17h6"/></svg>Orçamento</button>
</nav>
<script src="parser.js"></script>
<script>
/* ===== DADOS (protótipo: edição de 10/11/2026; no app real vêm da API /api/hoje) ===== */
let D=null;
/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const brl=v=>v==null?"—":"R$ "+Math.round(v).toLocaleString("pt-BR");
const mi=v=>v==null?"—":"R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mi";
const pct=(v,d=0)=>v==null?"—":v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const sg=v=>(v>=0?"+":"−")+brl(Math.abs(v)).replace("R$ ","R$ ");
const cor=p=>p>=100?"g":p>=90?"y":"r";
const st=p=>p>=100?"Acima da meta":p>=90?"Próximo da meta":"Em atenção";
let M,d1,atD1,atAcO,atAcB,falta,necDU;
function compute(){M=D.mes;d1=D.d1;atD1=d1.fat/d1.meta*100;atAcO=M.acum/M.metaAcOrc*100;atAcB=M.acum/M.metaAcBI*100;falta=M.metaOrc-M.acum;necDU=falta/M.duRest;}
/* ===== gráficos SVG ===== */
function lineChart(series,w=360,h=200,opts={}){const pad={l:38,r:8,t:12,b:24};const xs=series[0].pts.length;
 const maxV=opts.max||Math.max(...series.flatMap(s=>s.pts.filter(v=>v!=null)))*1.08;const X=i=>pad.l+(w-pad.l-pad.r)*i/((opts.n||xs)-1);const Y=v=>h-pad.b-(h-pad.t-pad.b)*v/maxV;
 let g="";for(let k=0;k<=4;k++){const v=maxV*k/4;g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--ink2)">${Math.round(v/1e6)} mi</text>`;}
 (opts.labels||[]).forEach(([i,t])=>g+=`<text x="${X(i)}" y="${h-8}" font-size="10" text-anchor="middle" fill="var(--ink2)">${t}</text>`);
 series.forEach(s=>{const p=s.pts.map((v,i)=>v==null?null:[X(i+(s.off||0)),Y(v)]).filter(Boolean);
  if(s.fill) g+=`<path d="M${p[0][0]},${Y(0)} L${p.map(q=>q.join(",")).join(" L")} L${p[p.length-1][0]},${Y(0)}Z" fill="${s.c}" opacity=".10"/>`;
  g+=`<polyline points="${p.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.5}" ${s.dash?'stroke-dasharray="6 5"':""} stroke-linejoin="round"/>`;
  if(s.end){const q=p[p.length-1];g+=`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${s.c}"/>`;}});
 if(opts.mark!=null) g+=`<line x1="${X(opts.mark)}" x2="${X(opts.mark)}" y1="${pad.t}" y2="${h-pad.b}" stroke="var(--ink2)" stroke-dasharray="2 3"/><text x="${X(opts.mark)+4}" y="${pad.t+10}" font-size="10" fill="var(--ink2)">hoje (D-1)</text>`;
 return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}</svg>`;}
function barsChart(items,w=360,h=190){const pad={l:24,r:4,t:18,b:22};const maxV=Math.max(...items.flatMap(i=>[i.v,i.m||0]))*1.12;const bw=(w-pad.l-pad.r)/items.length;
 const Y=v=>h-pad.b-(h-pad.t-pad.b)*v/maxV;let g="";for(let k=0;k<=3;k++){const v=maxV*k/3;g+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pad.l-5}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--ink2)">${Math.round(v/1e6)}</text>`;}
 items.forEach((it,i)=>{const x=pad.l+i*bw+bw*.18,bwi=bw*.64;if(it.ghost!=null) g+=`<rect x="${x-bw*.1}" y="${Y(it.ghost)}" width="${bwi}" height="${Y(0)-Y(it.ghost)}" rx="3" fill="var(--line)"/>`;
  if(it.v!=null) g+=`<rect x="${it.ghost!=null?x+bw*.1:x}" y="${Y(it.v)}" width="${bwi}" height="${Y(0)-Y(it.v)}" rx="3" fill="${it.c}"/>`;
  if(it.m!=null) g+=`<line x1="${x-3}" x2="${x+bwi+3}" y1="${Y(it.m)}" y2="${Y(it.m)}" stroke="var(--ink)" stroke-width="2"/>`;
  if(it.t) g+=`<text x="${x+bwi/2}" y="${Y(Math.max(it.v||0,it.m||0))-5}" font-size="8.5" font-weight="700" text-anchor="middle" fill="${it.c}">${it.t}</text>`;
  g+=`<text x="${x+bwi/2}" y="${h-8}" font-size="10" text-anchor="middle" fill="var(--ink2)">${it.l}</text>`;});
 return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}</svg>`;}
const C={g:"#1e8e4e",y:"#d08a0e",r:"#c62828"};
/* ===== telas ===== */
const regByName=n=>D.reg.find(r=>r[0]===n);
function resumoHtml(){const f=D.farol,g=f.filter(x=>x[1]>=100),y=f.filter(x=>x[1]>=90&&x[1]<100),r=f.filter(x=>x[1]<90);

async function lerPDF(file){const lib=await pdfjs();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const pages=[];
 for(let i=1;i<=doc.numPages;i++){const c=await (await doc.getPage(i)).getTextContent();let out="",y0=null;

const enc=new TextEncoder(),dec=new TextDecoder();const b64=u=>btoa(String.fromCharCode(...u)),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function chave(senha,salt){const k=await crypto.subtle.importKey("raw",enc.encode(senha),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function cifrar(obj,senha){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await chave(senha,salt),enc.encode(JSON.stringify(obj))));return JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)});}
async function decifrar(txt,senha){const j=JSON.parse(txt);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(j.iv)},await chave(senha,ub64(j.salt)),ub64(j.ct));return JSON.parse(dec.decode(pt));}

let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;$("#bInst").style.display="inline-block";});
async function doInstall(){if(!deferredInstall){cfgSheet();return;}deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$("#bInst").style.display="none";}
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});

const V={hoje:vHoje,mes:vMes,reg:vReg,proj:vProj,orc:vOrc};let cur="hoje";
function show(t){cur=t;$("#main").innerHTML=D?V[t]():vazio();document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));window.scrollTo(0,0);
 const seg=$("#ccSeg");if(seg) seg.onclick=e=>{const b=e.target.closest("button");if(!b)return;seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));};}
function paintHead(){if(!D){$("#updT").textContent="Nenhuma edição carregada";$("#dSel").innerHTML="";return;}
 $("#updT").textContent=(D.meta.modo==="api"?"Power BI ao vivo · "+D.meta.atualizado:D.meta.modo==="equipe"?"Edição da equipe":"PDF do dia")+" · D-1: "+d1.dia.slice(0,3)+", "+d1.data;
 $("#proto").style.display=D.meta.modo==="api"?"none":"block";
 const ks=Object.keys(edicoes()).sort().reverse();$("#dSel").innerHTML=ks.map(k=>`<option value="${k}" ${k===isoOf(d1.data)?"selected":""}>${k.slice(8)}/${k.slice(5,7)}</option>`).join("");}
function vazio(){return `<div class="card empty"><div class="ic">📄</div><b>Carregue a revista do dia</b><p class="note">Enquanto a API do Power BI não é liberada, o app é alimentado pelo PDF da Morning Operational News.</p><button class="btn" data-pdf style="margin-top:8px">Carregar PDF</button></div>`;}
document.querySelector("nav.tabs").onclick=e=>{const b=e.target.closest("button");if(b) show(b.dataset.t);};
document.addEventListener("click",e=>{if(e.target.closest("[data-pdf]")){document.querySelector(".sheet")?.remove();$("#pdfIn").click();}});
$("#main").addEventListener("click",e=>{if(e.target.closest("[data-pdf]"))return;if(e.target.closest("#ddsCard")) return ddsSheet();const m=e.target.closest("[data-m]");if(m) return mSheet(m.dataset.m);const r=e.target.closest("[data-reg]");if(r) regSheet(r.dataset.reg);});
$("#bAl").onclick=()=>D?alertsSheet():toastMsg("Carregue uma edição primeiro.");$("#bCfg").onclick=cfgSheet;$("#bInst").onclick=doInstall;
$("#dSel").onchange=()=>{const e=edicoes()[$("#dSel").value];if(e){D=e;LS.set("farolAtual",$("#dSel").value);compute();paintHead();show(cur);}};
$("#bSh").onclick=()=>{if(!D)return;const f=D.farol.map(([n,p])=>`${p>=100?"🟢":p>=90?"🟡":"🔴"} ${n} ${pct(p)}`).join("\n");
 const t=`*Farol Operacional · CT LOS*\nD-1: ${d1.data}\n\nFaturamento: ${brl(d1.fat)} (${pct(atD1)} da meta)\nAcumulado do mês: ${mi(M.acum)} (${pct(atAcO)} da orçada)\nProjeção: ${mi(M.proj)} (estimativa)\n\n${f}\n\nCarro parado é prejuízo. Vamos pra cima!`;
 window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");};
(()=>{const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),st=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
 if(ios&&!st&&!LS.get("farolIosHint",0)){const d=document.createElement("div");d.style.cssText="position:fixed;left:12px;right:12px;bottom:84px;background:#0f2350;color:#fff;border-radius:16px;padding:12px 14px;z-index:30;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)";
  d.innerHTML='<b>Instale o Farol no iPhone</b><br>Toque em Compartilhar ⬆︎ e depois em "Adicionar à Tela de Início". <a href="instalar.html" style="color:#9fd0ff">Ver passo a passo</a> <button style="float:right;background:none;border:0;color:#fff;font-size:18px">×</button>';
  d.querySelector("button").onclick=()=>{d.remove();LS.set("farolIosHint",1);};document.body.appendChild(d);}})();
(async()=>{D=await loadData();if(D)compute();paintHead();show("hoje");})();
