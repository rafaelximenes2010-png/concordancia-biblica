<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Devocional para WhatsApp · SOLA | Bíblia &amp; Teologia</title>
<link rel="icon" href="../icons/favicon-64.png">
<style>
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c2747;background:#f6f1e7}
  header{background:#0f1b33;color:#f4ead2;padding:16px 20px}
  header small{display:block;color:#c99a3b;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
  header h1{margin:0;font-size:18px}
  main{max-width:560px;margin:0 auto;padding:18px}
  .card{background:#fff;border:1px solid #e6dcc8;border-radius:16px;padding:16px;margin-bottom:14px}
  img{width:100%;border-radius:12px;display:block;margin-bottom:12px}
  pre{white-space:pre-wrap;font:15px/1.5 system-ui,sans-serif;margin:0;background:#e7f6e9;border-radius:12px;padding:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button,a.btn{font:600 15px/1 system-ui,sans-serif;padding:12px 16px;border-radius:12px;border:0;background:#1c2747;color:#fff;cursor:pointer;text-decoration:none}
  a.btn.wa{background:#1f8f4e}
  input{font:inherit;padding:8px 10px;border:1px solid #e6dcc8;border-radius:10px}
  p.hint{font-size:13px;color:#56607a}
</style>
</head>
<body>
<header><small>SOLA | Bíblia &amp; Teologia</small><h1>Devocional do dia para o WhatsApp</h1></header>
<main>
  <div class="card">
    <label>Dia: <input type="date" id="dia"></label>
    <p class="hint" id="st">Carregando…</p>
  </div>
  <div class="card">
    <img id="img" alt="Imagem do devocional" hidden>
    <pre id="msg"></pre>
    <div class="row">
      <button id="copy">Copiar mensagem</button>
      <a class="btn wa" id="share" href="#" target="_blank" rel="noopener">Abrir no WhatsApp</a>
    </div>
    <p class="hint">A mensagem já vem com negrito do WhatsApp (*assim*) e o link do devocional, que mostra a imagem na prévia.</p>
  </div>
</main>
<script>
/* Lê o mesmo conteúdo do Canal do Telegram (devocionais/canal/AAAA-MM.json) e converte para o formato do WhatsApp.
   Usado pela rotina automática de envio (Canal do WhatsApp + contatos VIP) e para envio manual. */
const $ = s => document.querySelector(s);
function hojeBR(){ return new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10); }
function paraWhats(html){
  return html.replace(/<b>([\s\S]*?)<\/b>/g, "*$1*").replace(/<i>([\s\S]*?)<\/i>/g, "_$1_").replace(/<[^>]+>/g, "")
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").trim();
}
async function carregar(dia){
  $("#st").textContent = "Carregando…"; $("#msg").textContent = ""; $("#img").hidden = true;
  document.body.dataset.ready = "";
  try {
    const d = await fetch(`../devocionais/canal/${dia.slice(0, 7)}.json?t=${Date.now()}`).then(r => { if (!r.ok) throw 0; return r.json(); });
    const it = d[dia]; if (!it) throw 0;
    const txt = paraWhats(it.caption);
    $("#msg").textContent = txt;
    $("#img").src = "../" + it.img; $("#img").hidden = false;
    $("#share").href = "https://wa.me/?text=" + encodeURIComponent(txt);
    $("#st").textContent = `${it.title} · ${dia.split("-").reverse().join("/")}`;
    document.body.dataset.ready = "1"; document.body.dataset.dia = dia; document.body.dataset.titulo = it.title;
  } catch (e) { $("#st").textContent = "Ainda não há devocional publicado para este dia."; document.body.dataset.ready = "0"; }
}
const q = new URLSearchParams(location.search).get("d");
$("#dia").value = /^\d{4}-\d{2}-\d{2}$/.test(q || "") ? q : hojeBR();
$("#dia").addEventListener("change", () => carregar($("#dia").value));
$("#copy").addEventListener("click", async () => { try { await navigator.clipboard.writeText($("#msg").textContent); $("#copy").textContent = "Copiada!"; } catch (e) { $("#copy").textContent = "Selecione e copie"; } setTimeout(() => $("#copy").textContent = "Copiar mensagem", 2000); });
carregar($("#dia").value);
</script>
</body>
</html>
