name: Monitor de uso do SOLA

# A cada 6 horas confere o uso do servidor (Cloudflare + Microsoft) e se o site está no ar.
# Se algum limite passar de 70%, ou o site cair, abre (ou atualiza) um issue "Alerta de uso",
# que chega por e-mail ao dono do repositório.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir uso e site
        run: |
          curl -s -m 30 https://tradutor.rafael-ximenes-2010.workers.dev/uso -o uso.json || echo '{}' > uso.json
          curl -s -o /dev/null -w "%{http_code}" -m 30 https://solabiblia.net.br/ > site.txt || echo 000 > site.txt
          cat uso.json | head -c 2000; echo; echo "site: $(cat site.txt)"
      - name: Abrir ou atualizar alerta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let uso = {}; try { uso = JSON.parse(fs.readFileSync('uso.json', 'utf8')); } catch (e) {}
            const site = fs.readFileSync('site.txt', 'utf8').trim();
            const prob = [];
            if (!/^(200|301|302|304)$/.test(site)) prob.push(`🔴 O site solabiblia.net.br respondeu ${site} (fora do ar ou com erro).`);
            if (uso.status === 'atencao' || uso.status === 'critico') {
              for (const m of uso.medidas || []) if (m.pct >= 70) prob.push(`${m.pct >= 90 ? '🔴' : '🟠'} ${m.nome}: ${m.pct}% (${m.valor.toLocaleString('pt-BR')} de ${m.limite.toLocaleString('pt-BR')} ${m.unidade})`);
              for (const a of uso.alertasHoje || []) if (!prob.some(p => p.includes(a.txt.slice(2, 40)))) prob.push(a.txt);
            }
            if (!uso.status) prob.push('🟠 O servidor do SOLA (tradutor.rafael-ximenes-2010.workers.dev/uso) não respondeu.');
            if (!prob.length) { core.info('Tudo dentro dos limites.'); return; }
            const h = uso.hoje || {};
            const body = `**${new Date().toLocaleString('pt-BR', { timeZone: 'America/Recife' })}**\n\n${prob.map(p => '- ' + p).join('\n')}\n\n` +
              `Hoje: ${h.traducoesNovas ?? '–'} traduções novas, ${h.traducoesDoCache ?? '–'} do cache, ${h.aparelhosNoLimite ?? '–'} aparelhos no limite, ${h.errosDoAzure ?? '–'} erros do Azure.\n\n` +
              `Painel: https://solabiblia.net.br/site/uso.html`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'alerta-uso' });
            if (open.data.length) await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            else await github.rest.issues.create({ owner, repo, title: '⚠️ Alerta de uso do SOLA', labels: ['alerta-uso'], body: body + '\n\nFeche este issue quando o problema estiver resolvido.' });
