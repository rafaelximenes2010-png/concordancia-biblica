# Notícias do mundo cristão (Estudos › Notícias no app).
# Todo dia de manhã (6h17 de Brasília, com repescagem às 9h17) escolhe as 5
# notícias mais importantes de cada tipo, checa as fontes, traduz para o
# português e publica noticias/feed.json no main e no gh-pages.
name: Notícias do mundo cristão
on:
  schedule:
    - cron: "17 9,12 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Refazer a seleção de hoje"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coletar e traduzir
        run: node tools/noticias.mjs
        env:
          FORCAR: ${{ inputs.forcar && '1' || '' }}
      - name: Publicar se mudou
        run: |
          git config user.name "SOLA Notícias"
          git config user.email "contato@solabiblia.net.br"
          git add noticias/feed.json
          if git diff --cached --quiet; then echo "Sem novidades."; exit 0; fi
          git commit -m "Notícias: atualização automática"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          # O push feito por este robô não dispara o outro workflow; publica direto no gh-pages
          git push --force origin HEAD:refs/heads/gh-pages
